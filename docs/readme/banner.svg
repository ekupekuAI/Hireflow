<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">HireFlow</title>
  <desc id="d">HireFlow — the AI screener that shows its work. Glass-box, bias-aware AI recruiting agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#120f2b"/>
    </linearGradient>
    <!-- wide gradient that slides horizontally = "gradient shift" -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#22b8f0" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9d2ff"/>
      <stop offset="1" stop-color="#8fd8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b87ff"/>
      <stop offset="1" stop-color="#38c6f4"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <style>
    .font { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .sweep { animation: sweep 9s ease-in-out infinite alternate; }
    .halo { animation: pulse 5s ease-in-out infinite; transform-origin: 300px 160px; transform-box: view-box; }
    .in1 { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .15s forwards; }
    .in2 { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .45s forwards; }
    .in3 { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .75s forwards; }
    .card { opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) .9s forwards; }
    .glow { animation: glow 4s ease-in-out 1.2s infinite; }
    .ring { stroke-dasharray: 176; stroke-dashoffset: 176; animation: ring 1.6s ease-out forwards; }
    .r1 { animation-delay: 1.2s; } .r2 { animation-delay: 1.45s; } .r3 { animation-delay: 1.7s; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: bar 1.2s ease-out forwards; }
    .b1 { animation-delay: 1.3s; } .b2 { animation-delay: 1.55s; } .b3 { animation-delay: 1.8s; }
    .blink { animation: blink 1.6s steps(1) 2s infinite; opacity: 0; }

    @keyframes sweep { from { transform: translateX(-520px); } to { transform: translateX(520px); } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 0 rgba(139,92,246,0)); } 50% { filter: drop-shadow(0 0 10px rgba(139,92,246,.75)); } }
    @keyframes ring { to { stroke-dashoffset: var(--off); } }
    @keyframes bar { to { transform: scaleX(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .sweep, .halo, .glow, .blink { animation: none; }
      .in1, .in2, .in3, .card { animation: none; opacity: 1; }
      .ring { animation: none; stroke-dashoffset: var(--off); }
      .bar { animation: none; transform: scaleX(1); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="sweep" x="-200" y="0" width="1600" height="320" fill="url(#sweep)" opacity="0.35"/>
    <circle class="halo" cx="300" cy="160" r="260" fill="url(#halo)"/>

    <!-- Left: logo + wordmark + tagline -->
    <g class="in1">
      <g transform="translate(80 92)">
        <rect width="64" height="64" rx="16" fill="url(#logo)"/>
        <path d="M22 46V20m0 12h16m0-12v26m10-28-6 6 6 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="glow">
        <text class="font" x="162" y="142" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1.5">HireFlow</text>
      </g>
    </g>
    <text class="font in2" x="82" y="200" font-size="27" font-weight="600" fill="#e8e4ff">The AI screener that <tspan fill="url(#accent)">shows its work</tspan></text>
    <text class="font in3" x="82" y="236" font-size="17" fill="#a7a3c7">Evidence-cited ranking · Blind Mode bias check · Interview kits · Full audit trail</text>

    <!-- Right: mini shortlist card -->
    <g class="card"><g transform="translate(760 54)">
      <rect width="370" height="212" rx="16" fill="#151230" stroke="#2c2752"/>
      <circle cx="22" cy="20" r="4.5" fill="#f87171" opacity=".7"/>
      <circle cx="37" cy="20" r="4.5" fill="#fbbf24" opacity=".7"/>
      <circle cx="52" cy="20" r="4.5" fill="#34d399" opacity=".7"/>
      <text class="font" x="70" y="25" font-size="12" fill="#8c88ad">Senior Backend Engineer — shortlist</text>

      <!-- row 1 -->
      <g transform="translate(16 44)">
        <text class="font" x="0" y="26" font-size="16" font-weight="700" fill="#9b87ff">1</text>
        <text class="font" x="22" y="18" font-size="14" font-weight="600" fill="#f1efff">Candidate #01</text>
        <rect x="22" y="28" width="210" height="5" rx="2.5" fill="#262247"/>
        <rect class="bar b1" x="22" y="28" width="200" height="5" rx="2.5" fill="#34d399"/>
        <circle cx="306" cy="22" r="28" fill="none" stroke="#262247" stroke-width="5"/>
        <circle class="ring r1" cx="306" cy="22" r="28" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" style="--off:9" transform="rotate(-90 306 22)"/>
        <text class="font" x="306" y="28" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle">95</text>
      </g>
      <!-- row 2 -->
      <g transform="translate(16 104)">
        <text class="font" x="0" y="26" font-size="16" font-weight="700" fill="#9b87ff">2</text>
        <text class="font" x="22" y="18" font-size="14" font-weight="600" fill="#f1efff">Candidate #04</text>
        <rect x="22" y="28" width="210" height="5" rx="2.5" fill="#262247"/>
        <rect class="bar b2" x="22" y="28" width="172" height="5" rx="2.5" fill="#34d399"/>
        <circle cx="306" cy="22" r="28" fill="none" stroke="#262247" stroke-width="5"/>
        <circle class="ring r2" cx="306" cy="22" r="28" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" style="--off:32" transform="rotate(-90 306 22)"/>
        <text class="font" x="306" y="28" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle">82</text>
      </g>
      <!-- row 3 -->
      <g transform="translate(16 164)">
        <text class="font" x="0" y="26" font-size="16" font-weight="700" fill="#9b87ff">3</text>
        <text class="font" x="22" y="18" font-size="14" font-weight="600" fill="#f1efff">Candidate #07</text>
        <rect x="22" y="28" width="210" height="5" rx="2.5" fill="#262247"/>
        <rect class="bar b3" x="22" y="28" width="128" height="5" rx="2.5" fill="#fbbf24"/>
        <circle cx="306" cy="22" r="28" fill="none" stroke="#262247" stroke-width="5"/>
        <circle class="ring r3" cx="306" cy="22" r="28" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" style="--off:67" transform="rotate(-90 306 22)"/>
        <text class="font" x="306" y="28" font-size="17" font-weight="800" fill="#fbbf24" text-anchor="middle">62</text>
      </g>
    </g></g>

    <!-- blinking cursor after the tagline line -->
    <rect class="blink" x="82" y="258" width="10" height="3" rx="1.5" fill="#9b87ff"/>
  </g>
  <rect width="1199" height="319" x=".5" y=".5" rx="22" fill="none" stroke="#2c2752"/>
</svg>
